```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e54e9);
      color: white;
      position: relative;
    }

    /* Background glowing circles */
    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.35;
      z-index: 0;
    }

    body::before {
      width: 250px;
      height: 250px;
      background: #ffd166;
      top: -80px;
      left: -80px;
    }

    body::after {
      width: 300px;
      height: 300px;
      background: #06d6a0;
      bottom: -120px;
      right: -100px;
    }

    .card {
      width: min(90%, 550px);
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
      z-index: 2;
      animation: cardAppear 1s ease forwards;
    }

    .emoji {
      font-size: 75px;
      animation: bounce 1.8s infinite;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(2.3rem, 9vw, 4.5rem);
      line-height: 1.1;
      margin-bottom: 15px;
      text-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    h1 span {
      color: #ffe066;
    }

    .subtitle {
      font-size: clamp(1rem, 4vw, 1.25rem);
      line-height: 1.6;
      opacity: 0.95;
      margin-bottom: 25px;
    }

    .message {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    button {
      border: none;
      outline: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: #fff;
      color: #e75480;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: translateY(-4px) scale(1.04);
    }

    button:active {
      transform: scale(0.96);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      opacity: 0.9;
      z-index: 10;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Mobile */
    @media (max-width: 500px) {
      .card {
        padding: 35px 20px;
        border-radius: 24px;
      }

      .emoji {
        font-size: 60px;
      }

      .message {
        font-size: 0.95rem;
      }

      button {
        width: 100%;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="emoji">🎂</div>

    <h1>
      Happy Birthday<br>
      <span>NAME!</span> 🎉
    </h1>

    <p class="subtitle">
      Wishing you a day full of happiness, laughter & beautiful memories! ✨
    </p>

    <p class="message">
      May this new year of your life bring you endless happiness,
      success, love and countless reasons to smile. ❤️
      Keep shining and keep being amazing! 🌟
    </p>

    <button onclick="celebrate()">
      🎁 Celebrate!
    </button>
  </div>

  <script>
    const colors = [
      "#ff595e",
      "#ffca3a",
      "#8ac926",
      "#1982c4",
      "#6a4c93",
      "#ffffff"
    ];

    function createConfetti(amount = 100) {
      for (let i = 0; i < amount; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
          Math.random() * 8 + 6 + "px";

        confetti.style.height =
          Math.random() * 12 + 8 + "px";

        confetti.style.animationDuration =
          Math.random() * 3 + 3 + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }

    function celebrate() {
      createConfetti(180);
    }

    // Automatic confetti when page loads
    window.addEventListener("load", () => {
      createConfetti(120);

      // Keep the celebration going
      setInterval(() => {
        createConfetti(25);
      }, 4000);
    });
  </script>

</body>
</html>
